# Isolated local/CI stack, not the hosted Supabase project.
project_id = "planning-budget-tests"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["../tests/database/fixtures.sql"]

[studio]
enabled = false

[analytics]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3206"
additional_redirect_urls = ["http://127.0.0.1:3206/auth/callback"]
enable_signup = false

[auth.email]
# Keep the email provider enabled for fixture-account login. New registrations
# remain disabled by auth.enable_signup above. This config is local/CI only.
enable_signup = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "20MiB"
